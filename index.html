<style>
  :root{
    --bg:#F4EBE7; --bg-alt:#FFFFFF; --card:#FFFFFF; --ink:#454341; --ink-dim:#9C8F86;
    --gold:#B98F86; --gold-ink:#FFFFFF; --red:#8C2F2F; --steel:#C9A24B; --line:rgba(69,67,65,0.15);
    --pole-red:#B98F86; --pole-blue:#B98F86; --pole-white:#F4EBE7; --lead:#454341;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}
  #root{flex:1;display:flex;flex-direction:column;}
  .stripe{height:9px;background:linear-gradient(90deg,var(--gold),#C9A24B);}
  .topbar{padding:18px 20px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);}
  .brand{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .brand span{color:var(--gold);}
  .link-btn{background:none;border:none;color:var(--ink-dim);font-family:'Inter';font-size:13px;cursor:pointer;padding:6px 0;}
  .link-btn:active{color:var(--gold);}
  .content{padding:18px 20px 100px;flex:1;}
  .screen-title{font-size:15px;color:var(--ink-dim);margin:0 0 4px;font-weight:500;letter-spacing:0.02em;}
  .screen-title b{color:var(--gold);}
  h1.page{font-size:26px;margin:0 0 18px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px;}
  .card.select{cursor:pointer;transition:border-color .15s;}
  .card.select:active{border-color:var(--gold);}
  .row{display:flex;align-items:center;gap:12px;}
  .avatar{width:46px;height:46px;border-radius:50%;background:var(--bg-alt);display:flex;align-items:center;justify-content:center;font-size:20px;border:1px solid var(--line);flex-shrink:0;}
  .grow{flex:1;min-width:0;}
  .name{font-weight:600;font-size:16px;}
  .sub{color:var(--ink-dim);font-size:13px;margin-top:2px;}
  .price-tag{background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:13px;padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .btn{display:block;width:100%;text-align:center;padding:14px;border-radius:8px;border:none;font-family:'Oswald';font-weight:600;font-size:15px;letter-spacing:0.03em;text-transform:uppercase;cursor:pointer;}
  .btn-gold{background:var(--gold);color:var(--gold-ink);}
  .btn-outline{background:none;border:1px solid var(--line);color:var(--ink);}
  .btn-red{background:var(--red);color:#fff;}
  .btn-steel{background:var(--steel);color:#fff;}
  .btn[disabled]{opacity:0.35;pointer-events:none;}
  .btn-sm{padding:8px 14px;font-size:12px;width:auto;display:inline-block;border-radius:6px;}
  input,select{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--bg-alt);color:var(--ink);font-family:'Inter';font-size:15px;margin-bottom:12px;}
  label.field-label{display:block;font-size:12px;color:var(--ink-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em;}
  .datestrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;}
  .calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .calmonth{font-family:'Oswald';font-weight:600;font-size:16px;text-transform:capitalize;}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;}
  .calgrid-head{color:var(--ink-dim);font-size:11px;text-align:center;margin-bottom:6px;}
  .calday{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--bg-alt);font-weight:600;font-size:14px;cursor:pointer;border:1px solid transparent;}
  .calday.muted{opacity:0.25;cursor:default;background:none;}
  .calday.active{background:var(--gold);color:var(--gold-ink);}

  .datebtn{flex:0 0 auto;border:1px solid var(--line);background:var(--bg-alt);color:var(--ink);border-radius:8px;padding:10px 12px;font-family:'Inter';font-size:12px;text-align:center;cursor:pointer;min-width:52px;}
  .datebtn b{display:block;font-size:16px;font-family:'Oswald';margin-top:2px;}
  .datebtn.active{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);}
  .datebtn.disabled{opacity:0.3;pointer-events:none;}
  .slotgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .slotbtn{padding:12px 4px;text-align:center;border:1px solid var(--line);background:var(--bg-alt);border-radius:8px;font-weight:600;cursor:pointer;font-size:14px;}
  .slotbtn.active{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);}
  .slotbtn.busy{opacity:0.4;text-decoration:line-through;cursor:not-allowed;background:transparent;}
  .empty{text-align:center;color:var(--ink-dim);padding:30px 10px;font-size:14px;}
  .tabbar{position:sticky;bottom:0;display:flex;border-top:1px solid var(--line);background:var(--bg);}
  .tab{flex:1;text-align:center;padding:12px 4px;font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:0.04em;font-weight:600;cursor:pointer;border-top:2px solid transparent;}
  .tab.active{color:var(--gold);border-top-color:var(--gold);}
  .appt{border-left:3px solid var(--gold);padding-left:12px;margin-bottom:12px;}
  .appt.cancelado{border-left-color:var(--ink-dim);opacity:0.5;}
  .appt-time{font-family:'Oswald';font-weight:600;font-size:15px;}
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--bg-alt);border:1px solid var(--line);color:var(--ink-dim);margin-left:6px;}
  .flexbtns{display:flex;gap:8px;margin-top:8px;}
  .flexbtns .btn-sm{flex:1;}
  .banner{background:var(--bg-alt);border:1px dashed var(--line);border-radius:8px;padding:12px;font-size:12px;color:var(--ink-dim);margin-bottom:16px;line-height:1.5;}
  .center{text-align:center;}
  .big-check{font-size:52px;margin-bottom:6px;}
  a.plain{color:var(--gold);text-decoration:none;}
  .steplist{display:flex;gap:6px;margin-bottom:18px;}
  .step{height:4px;flex:1;background:var(--line);border-radius:2px;}
  .step.done{background:var(--gold);}
  .service-edit input{margin-bottom:8px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .dayrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .daychip{padding:8px 10px;border-radius:6px;border:1px solid var(--line);font-size:12px;cursor:pointer;background:var(--bg-alt);}
  .daychip.on{background:var(--steel);color:#fff;border-color:var(--steel);}
  .calday{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;background:var(--bg-alt);font-weight:600;font-size:13px;cursor:pointer;border:1px solid transparent;gap:2px;padding:2px;}
  .calday.muted{opacity:0.35;}
  .calday.active{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);}
  .calbadges{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;min-height:12px;}
  .calbadge{font-size:9px;font-weight:700;padding:1px 4px;border-radius:8px;line-height:1.4;color:#fff;}
  .calbadge.green{background:#3C8C4A;}
  .calbadge.orange{background:#C9762C;}
  .schedgroup{background:var(--bg-alt);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px;}
  .checkrow{display:flex;align-items:center;gap:10px;padding:2px 0;}
  .checkrow input[type=checkbox]{width:auto;margin:0;flex-shrink:0;}
  .svc-select{border:1px solid var(--line);}
  .svc-select.checked{border-color:var(--gold);}
  .totalbar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--card);border-top:2px solid var(--pole-blue);box-shadow:0 -8px 20px rgba(0,0,0,0.5);padding:10px 18px 14px;z-index:60;}
  .totalbar .names{font-size:11px;color:var(--ink-dim);margin-bottom:4px;}
  .totalbar .sumrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .totalbar .sumrow b{font-family:'Oswald';font-size:18px;color:var(--pole-red);}
  .totalbar .btn{padding:11px;font-size:14px;background:var(--pole-blue);color:#fff;}
  .qtystepper{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .qtybtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg-alt);color:var(--ink);font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;}
  .qtybtn:active{border-color:var(--gold);color:var(--gold);}
  .qtybtn[disabled]{opacity:0.3;pointer-events:none;}
  .qtyval{min-width:16px;text-align:center;font-weight:700;font-size:15px;font-family:'Oswald';}
</style>
</head>

    blocks:[],
    dayOverrides:{},
    monthlyClients:[]
  };
}

async function loadDB(){
  if(!sb){
    alert('Configuração pendente: abra o código e cole a URL e a chave do Supabase (passo 3 do guia).');
    db = defaultDB();
    return;
  }
  try{
    const {data, error} = await sb.from('nail_data').select('value').eq('key', DB_KEY).maybeSingle();
    if(error) throw error;
    db = (data && data.value) ? data.value : defaultDB();
    if(!data) await saveDB();
  }catch(e){
    console.error(e);
    db = defaultDB();
  }
  if(!db.appointments) db.appointments = [];
  if(!db.blocks) db.blocks = [];
  if(!db.dayOverrides) db.dayOverrides = {};
  if(!db.monthlyClients) db.monthlyClients = [];
  if(!db.expenses) db.expenses = [];
  let migrated = false;
  if(db.barbers[0] && db.barbers[0].name==='Barbeiro 1'){ db.barbers[0].name='Junior'; migrated=true; }
  if(db.barbers[1] && db.barbers[1].name==='Barbeiro 2'){ db.barbers[1].name='Yuri'; migrated=true; }
  if(db.barbers.length>1){ db.barbers = db.barbers.filter(b=>b.name!=='Yuri'); migrated=true; }
  if(!db.barbers.length) db.barbers = defaultDB().barbers;
  db.barbers.forEach(b=>{
    if(JSON.stringify(b.workDays)===JSON.stringify([1,2,3,4,5,6])){ b.workDays=[2,3,4,5,6]; migrated=true; }
    if(!b.scheduleGroups || !b.scheduleGroups.length){
      b.scheduleGroups = [{id:uid(), days:(b.workDays||[]).slice(), start:b.workStart||540, end:b.workEnd||1140}];
      migrated=true;
    }
    if(!b.recurringBlocks){ b.recurringBlocks = []; migrated=true; }
  });
  (db.services||[]).forEach(s=>{
    if(s.name && s.name.trim().toLowerCase()==='luzes' && s.duration===30){ s.duration=60; migrated=true; }
    const norm = (s.name||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'');
    if(norm.includes('corte') && norm.includes('luz') && s.duration!==60){ s.duration=60; migrated=true; }
  });
  if(migrated) saveDB();
}

async function saveDB(){
  if(!sb) return;
  try{
    const {error} = await sb.from('nail_data').upsert({key:DB_KEY, value:db});
    if(error) throw error;
  }catch(e){
    console.error('Falha ao salvar dados', e);
    alert('Não consegui salvar agora. Verifique a conexão e tente de novo.');
  }
}
/* Busca a versão mais recente dos dados no Supabase, sem recarregar a página.
   Usado para que agendamentos/edições/cancelamentos feitos em um aparelho (cliente ou barbeiro)
   apareçam na agenda de quem está com o app aberto em outro aparelho. */
async function refreshDB(){
  if(!sb) return;
  try{
    const {data, error} = await sb.from('nail_data').select('value').eq('key', DB_KEY).maybeSingle();
    if(error) throw error;
    if(data && data.value){
      db = data.value;
      if(!db.appointments) db.appointments = [];
      if(!db.blocks) db.blocks = [];
      if(!db.dayOverrides) db.dayOverrides = {};
      if(!db.monthlyClients) db.monthlyClients = [];
      if(!db.expenses) db.expenses = [];
    }
  }catch(e){
    console.error('Falha ao atualizar dados', e);
  }
}
/* Telas em que é seguro re-renderizar sozinho ao chegar dado novo (não interrompe o barbeiro/cliente
   no meio de um formulário que ele esteja preenchendo). */
const LIVE_REFRESH_VIEWS = new Set(['home','barberDashboard','clientMyAppts','clientLookupPhone']);
function startLivePolling(){
  setInterval(async ()=>{
    await refreshDB();
    /* Na área do barbeiro, só re-renderiza sozinho na aba Agenda: as demais abas
       (Config, Serviços, Mensais, Financeiro) têm formulários com campos de texto
       que o barbeiro pode estar preenchendo, e um re-render no meio apagaria o
       que ele digitou (ex: bloqueio de horário). */
    if(state.view==='barberDashboard'){
      if((state.barberTab||'agenda')==='agenda') render();
    } else if(LIVE_REFRESH_VIEWS.has(state.view)){
      render();
    }
  }, 8000);
}

/* ---------------- helpers ---------------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function pad(n){ return String(n).padStart(2,'0'); }
function minToLabel(m){ return pad(Math.floor(m/60))+':'+pad(m%60); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function addDaysStr(base, n){ const d=new Date(base+'T00:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dow(dateStr){ return new Date(dateStr+'T00:00:00').getDay(); }
function prettyDate(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('pt-BR',{weekday:'short', day:'2-digit', month:'short'});
}
function nowMinutes(){ const n=new Date(); return n.getHours()*60+n.getMinutes(); }
function toWaNumber(phone){
  let digits = (phone||'').replace(/\D/g,'');
  if(digits.length<=11) digits = '55'+digits;
  return digits;
}
function openWhats(phone, text){
  const url = 'whatsapp://send?phone='+toWaNumber(phone)+'&text='+encodeURIComponent(text);
  window.location.href = url;
  return url;
}
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* Formata preço para exibição ao CLIENTE: se o serviço estiver zerado (ex: incluso no mensal), não mostra nada. */
function clientPriceLabel(price){ return (price>0) ? ('R$ '+price.toFixed(2)) : ''; }
/* Máscara para campos de horário: o barbeiro digita só os números (ex: 1300) e o campo já formata para 13:00 */
function maskTimeInput(el){
  let v = el.value.replace(/\D/g,'');
  /* Hora não pode começar com 3-9 (não existe hora "3x" em relógio 24h), então nesse caso
     entende que o barbeiro quis dizer uma hora de 1 dígito (ex: digitou "900" = 9:00) e completa com zero. */
  if(v.length>=1 && parseInt(v[0],10)>2) v = '0'+v;
  v = v.slice(0,4);
  if(v.length>=3) v = v.slice(0,2)+':'+v.slice(2);
  el.value = v;
}

function dayOverrideKey(barberId, dateStr){ return barberId+'|'+dateStr; }
function getEffectiveHours(barberId, dateStr){
  const barber = db.barbers.find(b=>b.id===barberId);
  const override = db.dayOverrides[dayOverrideKey(barberId, dateStr)];
  if(override){
    if(override.mode==='closed') return null;
    if(override.mode==='open') return {start:override.workStart, end:override.workEnd};
  }
  const d = dow(dateStr);
  const groups = (barber.scheduleGroups && barber.scheduleGroups.length) ? barber.scheduleGroups : [{days:barber.workDays, start:barber.workStart, end:barber.workEnd}];
  const group = groups.find(g=>g.days.includes(d));
  if(!group) return null;
  return {start:group.start, end:group.end};
}
function getSlots(barberId, dateStr, duration, step, extraBusy, excludeApptId, ignorePastTime){
  step = step || 30;
  const hours = getEffectiveHours(barberId, dateStr);
  if(!hours) return [];
  const barber = db.barbers.find(b=>b.id===barberId);
  const d = dow(dateStr);
  const recurringBlocks = (barber && barber.recurringBlocks) ? barber.recurringBlocks.filter(rb=>rb.days.includes(d)) : [];
  const dayAppts = db.appointments.filter(a=>a.barberId===barberId && a.date===dateStr && a.status!=='cancelado' && a.id!==excludeApptId);
  const dayBlocks = db.blocks.filter(b=>b.barberId===barberId && b.date===dateStr);
  const busy = dayAppts.concat(dayBlocks).concat(recurringBlocks).concat(extraBusy||[]);
  const slots=[];
  const isToday = dateStr===todayStr();
  const now = nowMinutes();
  for(let s=hours.start; s+duration<=hours.end; s+=step){
    if(isToday && !ignorePastTime && s < now+10) continue;
    const conflict = busy.some(a=> s < a.end && a.start < s+duration);
    if(!conflict) slots.push(s);
  }
  return slots;
}
function getAllSlotsWithStatus(barberId, dateStr, duration, step, extraBusy, excludeApptId){
  step = step || 30;
  const hours = getEffectiveHours(barberId, dateStr);
  if(!hours) return [];
  const barber = db.barbers.find(b=>b.id===barberId);
  const d = dow(dateStr);
  const recurringBlocks = (barber && barber.recurringBlocks) ? barber.recurringBlocks.filter(rb=>rb.days.includes(d)) : [];
  const dayAppts = db.appointments.filter(a=>a.barberId===barberId && a.date===dateStr && a.status!=='cancelado' && a.id!==excludeApptId);
  const dayBlocks = db.blocks.filter(b=>b.barberId===barberId && b.date===dateStr);
  const busy = dayAppts.concat(dayBlocks).concat(recurringBlocks).concat(extraBusy||[]);
  const isToday = dateStr===todayStr();
  const now = nowMinutes();
  const list=[];
  for(let s=hours.start; s+duration<=hours.end; s+=step){
    if(isToday && s < now+10) continue;
    const conflict = busy.some(a=> s < a.end && a.start < s+duration);
    list.push({start:s, free:!conflict});
  }
  return list;
}

/* ---------------- app state (in-memory, per session) ---------------- */
let state = { view:'home' };

function go(view, patch){ state = Object.assign({}, state, {view}, patch||{}); render(); }

/* ---------------- render dispatcher ---------------- */
function render(){
  const root = document.getElementById('root');
  root.innerHTML = viewFor(state.view);
}

function viewFor(view){
  switch(view){
    case 'home': return renderHome();
    case 'clientService': return renderClientService();
    case 'clientDate': return renderClientDate();
    case 'clientSlot': return renderClientSlot();
    case 'clientDetails': return renderClientDetails();
    case 'clientConfirm': return renderClientConfirm();
    case 'clientLookupPhone': return renderClientLookupPhone();
    case 'clientMyAppts': return renderClientMyAppts();
    case 'barberLogin': return renderBarberLogin();
    case 'barberDashboard': return renderBarberDashboard();
    case 'barberNewAppt': return renderBarberNewAppt();
    case 'barberEditAppt': return renderBarberEditAppt();
    case 'barberMensalForm': return renderMensalForm();
    default: return renderHome();
  }
}

function steps(activeIdx, total){
  let h = '<div class="steplist">';
  for(let i=0;i<total;i++) h += `<div class="step ${i<=activeIdx?'done':''}"></div>`;
  h += '</div>';
  return h;
}


function renderClientService(){
  const c = state.client;
  if(!c.serviceQty) c.serviceQty = {};
  const orderedServices = db.services.slice().sort((a,b)=>{
    const aSimples = (a.name||'').trim().toLowerCase()==='corte simples';
    const bSimples = (b.name||'').trim().toLowerCase()==='corte simples';
    const aLateral = (a.name||'').toLowerCase().includes('lateral');
    const bLateral = (b.name||'').toLowerCase().includes('lateral');
    if(aSimples && bLateral) return -1;
    if(bSimples && aLateral) return 1;
    return a.name.localeCompare(b.name,'pt-BR');
  });
  let cards = orderedServices.map(s=>{
    const qty = c.serviceQty[s.id]||0;
    return `
    <div class="card svc-select ${qty>0?'checked':''}">
      <div class="row">
        <div class="grow">
          <div class="name">${esc(s.name)}</div>

        </div>
        <div class="qtystepper">
          <button type="button" class="qtybtn" ${qty===0?'disabled':''} onclick="changeServiceQty('${s.id}',-1)">−</button>
          <span class="qtyval">${qty}</span>
          <button type="button" class="qtybtn" onclick="changeServiceQty('${s.id}',1)">+</button>
        </div>
      </div>
      ${qty>0?`<div class="sub" style="margin-top:8px;text-align:right">Subtotal: R$ ${(s.price*qty).toFixed(2)}</div>`:''}
    </div>`;
  }).join('');
  const selected = clientSelectedServices();
  const totalDuration = clientTotalDuration();
  const totalPrice = clientTotalPrice();

    <div class="content" style="${selected.length?'padding-bottom:160px':''}">

      ${cards}
    </div>

    <div class="totalbar">
      <div class="names">${esc(clientServiceNames())}</div>
      <div class="sumrow">
        <div class="sub">${totalDuration} min</div>
        <b>R$ ${totalPrice.toFixed(2)}</b>
      </div>
      <button class="btn btn-gold" onclick="continueFromServices()">Continuar</button>
    </div>` : ''}`;
}
function changeServiceQty(sid, delta){
  const c = state.client;
  if(!c.serviceQty) c.serviceQty = {};
  const cur = c.serviceQty[sid]||0;
  const next = Math.max(0, Math.min(9, cur+delta));
  if(next===0) delete c.serviceQty[sid];
  else c.serviceQty[sid] = next;
  render();
}
function continueFromServices(){
  if(!clientSelectedServices().length){ alert('Escolha ao menos um serviço.'); return; }
  const c = state.client;
  const items = [];
  clientSelectedServices().forEach(s=>{
    for(let i=0;i<s.qty;i++) items.push({id:uid(), serviceId:s.id, name:s.name, duration:s.duration, price:s.price, date:null, slot:null});
  });
  c.items = items;
  c.itemIndex = 0;
  state.calMonth = null;
  go('clientDate');
}
function extraBusyForItem(item, dateStr){
  // outros serviços já agendados nesta mesma sacola, no mesmo dia, contam como ocupado
  return state.client.items.filter(it=>it.id!==item.id && it.date===dateStr && it.slot!=null).map(it=>({start:it.slot, end:it.slot+it.duration}));
}
function clientSelectedServices(){
  const qtyMap = state.client.serviceQty || {};
  return db.services.filter(s=>(qtyMap[s.id]||0)>0).map(s=>Object.assign({}, s, {qty:qtyMap[s.id]}));
}
function clientTotalDuration(){
  return clientSelectedServices().reduce((a,s)=>a+s.duration*s.qty,0);
}
function clientTotalPrice(){
  return clientSelectedServices().reduce((a,s)=>a+s.price*s.qty,0);
}
function clientServiceNames(){
  return clientSelectedServices().map(s=>s.qty>1?`${s.name} x${s.qty}`:s.name).join(' + ');
}

function capFirst(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function renderClientDate(){
  const c = state.client;
  const item = c.items[c.itemIndex];
  const multi = c.items.length>1;
  const today = new Date(todayStr()+'T00:00:00');
  const maxDate = new Date(today); maxDate.setDate(maxDate.getDate()+30); // janela fixa de 31 dias (hoje + 30)

  if(!state.calMonth) state.calMonth = {y: today.getFullYear(), m: today.getMonth()};
  const {y,m} = state.calMonth;
  const firstOfMonth = new Date(y,m,1);
  const startWeekday = firstOfMonth.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const monthMin = today.getFullYear()*12+today.getMonth();
  const monthMax = maxDate.getFullYear()*12+maxDate.getMonth();
  const curMonthIdx = y*12+m;

  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += '<div></div>';
  for(let day=1; day<=daysInMonth; day++){
    const d = `${y}-${pad(m+1)}-${pad(day)}`;
    const dObj = new Date(y,m,day);
    const inRange = dObj>=today && dObj<=maxDate;
    const hasSlots = inRange && getSlots(c.barberId, d, item.duration, 30, extraBusyForItem(item, d)).length>0;
    cells += `<div class="calday ${hasSlots?'':'muted'} ${item.date===d?'active':''}" ${hasSlots?`onclick="selectClientDate('${d}')"`:''}>${day}</div>`;
  }
  const weekdayLabels = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const monthLabel = capFirst(firstOfMonth.toLocaleDateString('pt-BR',{month:'long', year:'numeric'}));

  return `
    <div class="topbar"><button class="link-btn" onclick="backFromDate()">‹ Voltar</button></div>
    <div class="content">
      ${steps(1,3)}
      <div class="screen-title">Passo 2 de 3${multi?` · Serviço ${c.itemIndex+1} de ${c.items.length}`:''}</div>
      <h1 class="page">Escolha o dia${multi?` — ${esc(item.name)}`:''}</h1>
      ${multi?`<div class="sub" style="margin-bottom:12px">Pode ser no mesmo dia dos outros serviços ou em um dia diferente.</div>`:''}
      <div class="calnav">
        <button class="link-btn" ${curMonthIdx<=monthMin?'disabled style="opacity:0.25"':''} onclick="shiftMonth(-1)">‹</button>
        <div class="calmonth">${monthLabel}</div>
        <button class="link-btn" ${curMonthIdx>=monthMax?'disabled style="opacity:0.25"':''} onclick="shiftMonth(1)">›</button>
      </div>
      <div class="calgrid calgrid-head">${weekdayLabels.map(w=>`<div>${w}</div>`).join('')}</div>
      <div class="calgrid">${cells}</div>
      ${item.date ? '<button class="btn btn-gold" style="margin-top:16px" onclick="go(\'clientSlot\')">Continuar</button>' : ''}
    </div>`;
}
function shiftMonth(delta){
  let {y,m} = state.calMonth;
  m += delta;
  if(m<0){ m=11; y--; }
  if(m>11){ m=0; y++; }
  state.calMonth = {y,m};
  render();
}
function selectClientDate(d){
  const item = state.client.items[state.client.itemIndex];
  item.date = d;
  item.slot = null;
  render();
}
function backFromDate(){

async function submitClientBooking(){
  const name = document.getElementById('cliName').value.trim();
  const phone = document.getElementById('cliPhone').value.trim();
  if(!name || !phone){ alert('Preencha nome e WhatsApp.'); return; }
  const c = state.client;
  const barber = db.barbers.find(b=>b.id===c.barberId);
  // re-checa cada item (segurança contra conflito de última hora)
  for(let i=0;i<c.items.length;i++){
    const item = c.items[i];
    const stillFree = getSlots(c.barberId, item.date, item.duration, 30, extraBusyForItem(item, item.date)).includes(item.slot);
    if(!stillFree){
      alert(`O horário de "${item.name}" (${prettyDate(item.date)} às ${minToLabel(item.slot)}) acabou de ser ocupado. Escolha outro horário para esse serviço.`);
      c.itemIndex = i;
      go('clientDate');
      return;
    }
  }
  const groupId = uid();
  const apptIds = [];
  c.items.forEach(item=>{
    const appt = {
      id: uid(), groupId, barberId:c.barberId, serviceId:item.serviceId, serviceName:item.name, servicePrice:item.price,
      services: [{id:item.serviceId, name:item.name, price:item.price, duration:item.duration, qty:1}],
      clientName:name, clientPhone:phone, date:item.date, start:item.slot, end:item.slot+item.duration,
      status:'confirmado', source:'cliente', createdAt:Date.now()
    };
    db.appointments.push(appt);
    apptIds.push(appt.id);
  });
  await saveDB();
  c.name=name; c.phone=phone; c.apptIds=apptIds;
  if(barber.whatsapp){
    const lines = c.items.map(item=>`• ${item.name}: ${prettyDate(item.date)} às ${minToLabel(item.slot)}`).join('\n');
    const totalPrice = c.items.reduce((a,it)=>a+it.price,0);
    const msg = `Olá ${barber.name}! Meu nome é ${name}. Agendei:\n${lines}\nValor total: R$ ${totalPrice.toFixed(2)}.`;
    openWhats(barber.whatsapp, msg);
  }
  go('clientConfirm');
}

function makeGCalUrl(dateStr, startMin, durationMin, title, details){
  const d = new Date(dateStr+'T00:00:00');
  d.setMinutes(d.getMinutes()+startMin);
  const end = new Date(d.getTime()+durationMin*60000);
  const fmt = dt => dt.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const params = new URLSearchParams({action:'TEMPLATE', text:title, dates: fmt(d)+'/'+fmt(end), details: details});
  return 'https://calendar.google.com/calendar/render?'+params.toString();
}
function makeICS(barber, service, c){
  const d = new Date(c.date+'T00:00:00');
  d.setMinutes(d.getMinutes()+c.slot);
  const end = new Date(d.getTime()+service.duration*60000);
  const fmt = dt => dt.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','BEGIN:VEVENT',
    'SUMMARY:'+service.name+' - '+barber.name,
    'DTSTART:'+fmt(d),'DTEND:'+fmt(end),
    'DESCRIPTION:Agendamento no Dani Almeida Nail Design.'+(service.price>0?' Valor R$ '+service.price.toFixed(2):''),
    'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:Lembrete: agendamento amanhã','END:VALARM',
    'BEGIN:VALARM','TRIGGER:-PT2H','ACTION:DISPLAY','DESCRIPTION:Lembrete: agendamento hoje','END:VALARM',
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  return 'data:text/calendar;charset=utf-8,'+encodeURIComponent(ics);
}

function parseHHMM(v){
  const m = (v||'').trim().match(/^(\d{1,2}):(\d{2})$/);
  if(!m) return null;
  return parseInt(m[1])*60+parseInt(m[2]);
}

function mondayOf(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const day = d.getDay();
  const diff = day===0 ? -6 : 1-day;
  return addDaysStr(dateStr, diff);
}
function periodStats(barber, fromDate, toDate){
  const appts = db.appointments.filter(a=>a.barberId===barber.id && a.date>=fromDate && a.date<=toDate);
  const confirmed = appts.filter(a=>a.status!=='cancelado');
  const canceled = appts.filter(a=>a.status==='cancelado');
  const revenue = confirmed.reduce((sum,a)=>sum+a.servicePrice,0);
  const byService = {};
  confirmed.forEach(a=>{
    const key = a.serviceName || 'Outro';
    if(!byService[key]) byService[key] = {name:key, count:0, revenue:0};
    byService[key].count++;
    byService[key].revenue += a.servicePrice;
  });
  const services = Object.values(byService).sort((a,b)=>b.count-a.count);
  return {confirmed:confirmed.length, canceled:canceled.length, revenue, services};
}
function expensesInRange(barberId, fromDate, toDate){
  const items = (db.expenses||[]).filter(e=>e.barberId===barberId && e.date>=fromDate && e.date<=toDate).sort((a,b)=>a.date<b.date?1:-1);
  const total = items.reduce((sum,e)=>sum+(e.value||0),0);
  return {items, total};
}
function revenueMask(id, value, expensesTotal){

}

  const from = state.finWeekStart;

function renderFinMonth(barber){
  const {y,m} = state.finMonth;
  const prefix = `${y}-${pad(m+1)}-`;
  const daysInMonth = new Date(y,m+1,0).getDate();
  const monthLabel = capFirst(new Date(y,m,1).toLocaleDateString('pt-BR',{month:'long', year:'numeric'}));
  const monthFrom = `${prefix}01`, monthTo = `${prefix}${pad(daysInMonth)}`;
  const stats = periodStats(barber, monthFrom, monthTo);
  const exp = expensesInRange(barber.id, monthFrom, monthTo);

  // quebra o mês em blocos de 7 dias (semana 1: 1-7, semana 2: 8-14, ...)
  const weeks = [];
  for(let start=1; start<=daysInMonth; start+=7){
    const end = Math.min(start+6, daysInMonth);
    const from = `${prefix}${pad(start)}`;
    const to = `${prefix}${pad(end)}`;
    const ws = periodStats(barber, from, to);
    weeks.push({label:`${start}–${end}`, revenue:ws.revenue, confirmed:ws.confirmed});
  }
  const withMovement = weeks.filter(w=>w.confirmed>0 || w.revenue>0);
  let bestWorstHtml = '';
  if(withMovement.length>1){
    const best = withMovement.reduce((a,b)=>b.revenue>a.revenue?b:a);
    const worst = withMovement.reduce((a,b)=>b.revenue<a.revenue?b:a);
    bestWorstHtml = `
    <div class="card">
      <div class="name" style="margin-bottom:10px">Melhor e pior semana do mês</div>
      <div class="row" style="margin-bottom:6px"><div class="grow sub">🟢 Melhor: dias ${best.label}</div><div class="sub" style="font-weight:600">R$ ${best.revenue.toFixed(2)}</div></div>
      <div class="row"><div class="grow sub">🔴 Mais fraca: dias ${worst.label}</div><div class="sub" style="font-weight:600">R$ ${worst.revenue.toFixed(2)}</div></div>
    </div>`;
  }

  return `
    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <button class="link-btn" onclick="shiftFinMonth(-1)">‹</button>
        <div class="grow name" style="text-align:center">${monthLabel}</div>
        <button class="link-btn" onclick="shiftFinMonth(1)">›</button>
      </div>
      <div class="row" style="margin-bottom:6px"><div class="grow sub">Atendimentos confirmados</div><div class="sub" style="font-weight:600">${stats.confirmed}</div></div>
      <div class="row" style="margin-bottom:6px"><div class="grow sub">Cancelamentos</div><div class="sub" style="font-weight:600">${stats.canceled}</div></div>
      ${revenueMask('month', stats.revenue, exp.total)}
    </div>
    <div class="card">
      <div class="name" style="margin-bottom:10px">Por serviço</div>
      ${servicesBreakdownHtml(stats.services)}
    </div>
    ${expensesCardHtml(barber, monthFrom, monthTo)}
    ${bestWorstHtml}`;
}
function shiftFinMonth(delta){
  let {y,m} = state.finMonth;
  m += delta;
  if(m<0){ m=11; y--; }
  if(m>11){ m=0; y++; }
  state.finMonth = {y,m};
  state.expenseDraft = null;
  render();
}
function renderFinYear(barber){
  const y = state.finYear;
  const monthNames = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  let totalConfirmed=0, totalCanceled=0, totalRevenue=0;
  const byServiceAll = {};
  const months = [];
  for(let m=0;m<12;m++){
    const prefix = `${y}-${pad(m+1)}-`;
    const daysInMonth = new Date(y,m+1,0).getDate();
    const stats = periodStats(barber, `${prefix}01`, `${prefix}${pad(daysInMonth)}`);
    totalConfirmed += stats.confirmed; totalCanceled += stats.canceled; totalRevenue += stats.revenue;
    stats.services.forEach(s=>{
      if(!byServiceAll[s.name]) byServiceAll[s.name] = {name:s.name, count:0, revenue:0};
      byServiceAll[s.name].count += s.count;
      byServiceAll[s.name].revenue += s.revenue;
    });
    months.push({label:monthNames[m], confirmed:stats.confirmed, revenue:stats.revenue});
  }
  const yearFrom = `${y}-01-01`, yearTo = `${y}-12-31`;
  const exp = expensesInRange(barber.id, yearFrom, yearTo);
  const withMovement = months.filter(mo=>mo.confirmed>0 || mo.revenue>0);
  let bestWorstHtml = '';

function renderBarberCalendar(barber, selectedDate){
  if(!state.barberCalMonth){

  }
  const {y,m} = state.barberCalMonth;
  const firstOfMonth = new Date(y,m,1);
  const startWeekday = firstOfMonth.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const weekdayLabels = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const monthLabel = capFirst(firstOfMonth.toLocaleDateString('pt-BR',{month:'long', year:'numeric'}));
  const expanded = !!state.barberCalExpanded;

  let cells = '';
  let monthConfirmed = 0, monthCanceled = 0;
  for(let i=0;i<startWeekday;i++) cells += '<div></div>';
  for(let day=1; day<=daysInMonth; day++){
    const d = `${y}-${pad(m+1)}-${pad(day)}`;
    const dayAppts = db.appointments.filter(a=>a.barberId===barber.id && a.date===d);
    const confirmedCount = dayAppts.filter(a=>a.status!=='cancelado').length;
    const canceledCount = dayAppts.filter(a=>a.status==='cancelado').length;
    monthConfirmed += confirmedCount; monthCanceled += canceledCount;
    cells += `<div class="calday ${selectedDate===d?'active':''}" onclick="setBarberDate('${d}')">
      <div>${day}</div>
      <div class="calbadges">
        ${confirmedCount?`<span class="calbadge green">${confirmedCount}</span>`:''}
        ${canceledCount?`<span class="calbadge orange">${canceledCount}</span>`:''}
      </div>
    </div>`;

      <div class="calnav">

        <div class="calmonth" style="cursor:pointer" onclick="toggleBarberCalExpanded()">${monthLabel} ${expanded?'▲':'▼'}</div>

let recurBlockSelectedDays = [];
function toggleRecurDay(i){
  const el = document.getElementById('recurDay'+i);
  if(!el) return;
  const idx = recurBlockSelectedDays.indexOf(i);
  if(idx>=0){ recurBlockSelectedDays.splice(idx,1); el.classList.remove('on'); }
  else { recurBlockSelectedDays.push(i); el.classList.add('on'); }
}
async function addRecurringBlock(barberId){
  const barber = db.barbers.find(b=>b.id===barberId);
  const s = parseHHMM(document.getElementById('recurStart').value);
  const e = parseHHMM(document.getElementById('recurEnd').value);
  const label = (document.getElementById('recurLabel').value||'Bloqueado').trim();
  if(s==null||e==null||e<=s){ alert('Informe horários válidos, ex: 12:00'); return; }
  if(!recurBlockSelectedDays.length){ alert('Selecione ao menos um dia da semana.'); return; }
  if(!barber.recurringBlocks) barber.recurringBlocks = [];
  barber.recurringBlocks.push({id:uid(), days:recurBlockSelectedDays.slice(), start:s, end:e, label});
  recurBlockSelectedDays = [];
  state.showRecurringBlockForm = false;
  await saveDB();
  render();
}
async function removeRecurringBlock(barberId, id){
  if(!confirm('Remover este bloqueio fixo? Ele deixará de valer em todas as semanas.')) return;
  const barber = db.barbers.find(b=>b.id===barberId);
  barber.recurringBlocks = (barber.recurringBlocks||[]).filter(b=>b.id!==id);
  await saveDB();
  render();
}
async function updateBarber(field, val){
  const barber = db.barbers.find(b=>b.id===state.barberSession);
  barber[field] = val;
  await saveDB();
}
async function toggleGroupDay(groupId, dayIdx){
  const barber = db.barbers.find(b=>b.id===state.barberSession);
  const target = barber.scheduleGroups.find(g=>g.id===groupId);
  const alreadyInTarget = target.days.includes(dayIdx);
  // um dia só pode estar em um grupo por vez, então tira ele de todos primeiro
  barber.scheduleGroups.forEach(g=>{ g.days = g.days.filter(d=>d!==dayIdx); });
  // se já estava marcado neste grupo, o clique foi pra desmarcar — não recoloca
  if(!alreadyInTarget){
    target.days.push(dayIdx);
  }
  barber.workDays = barber.scheduleGroups.flatMap(g=>g.days);
  await saveDB();
  render();
}
async function updateGroupTime(groupId, field, val){
  const barber = db.barbers.find(b=>b.id===state.barberSession);
  const [h,m] = val.split(':').map(Number);
  if(isNaN(h)||isNaN(m)) return;
  const target = barber.scheduleGroups.find(g=>g.id===groupId);
  target[field] = h*60+m;
  await saveDB();
  render();
}
async function addScheduleGroup(){
  const barber = db.barbers.find(b=>b.id===state.barberSession);
  barber.scheduleGroups.push({id:uid(), days:[], start:540, end:1140});
  await saveDB();
  render();
}
async function removeScheduleGroup(groupId){
  const barber = db.barbers.find(b=>b.id===state.barberSession);
  if(barber.scheduleGroups.length<=1) return;
  if(!confirm('Remover estes dias e horário?')) return;
  barber.scheduleGroups = barber.scheduleGroups.filter(g=>g.id!==groupId);
  barber.workDays = barber.scheduleGroups.flatMap(g=>g.days);
  await saveDB();
  render();
}

async function deleteMensalClient(id){

async function saveMensalClient(){
  const d = state.mensalDraft;
  const name = (document.getElementById('mcName').value||'').trim();
  const phone = (document.getElementById('mcPhone').value||'').trim();
  const value = parseFloat(document.getElementById('mcValue').value)||0;
  if(!name){ alert('Informe o nome do cliente.'); return; }
  if(!d.serviceId){ alert('Selecione um serviço.'); return; }
  let clientId;
  if(d.id){
    const c = db.monthlyClients.find(x=>x.id===d.id);
    Object.assign(c, {name, phone, monthlyValue:value, serviceId:d.serviceId, dow:d.dow, start:d.start, weeks:d.weeks});
    clientId = c.id;
  } else {
    clientId = uid();
    db.monthlyClients.push({id:clientId, barberId:d.barberId, name, phone, monthlyValue:value, serviceId:d.serviceId, dow:d.dow, start:d.start, weeks:d.weeks, createdAt:Date.now()});
  }
  await saveDB();
  state.mensalDraft = null;
  state.barberTab = 'mensais';
  go('barberDashboard');
  /* Já gera os agendamentos semanais na hora de salvar, para o horário ficar ocupado
     e aparecer na agenda imediatamente, sem precisar de um segundo clique. */
  await generateMensalAppointments(clientId);
}
async function generateMensalAppointments(clientId){
  const c = db.monthlyClients.find(x=>x.id===clientId);
  if(!c) return;
  const barber = db.barbers.find(b=>b.id===c.barberId) || db.barbers.find(b=>b.id===state.barberSession);
  const service = db.services.find(s=>s.id===c.serviceId);
  if(!service){ alert('Selecione um serviço válido para este cliente antes de gerar os agendamentos.'); return; }
  let firstDate = todayStr();
  const diff = (c.dow - dow(firstDate) + 7) % 7;
  firstDate = addDaysStr(firstDate, diff);
  const groupId = uid();
  const weeks = Math.min(52, Math.max(1, c.weeks||8));
  const monthsSeen = {};
  let skipped = [];
  let created = 0;
  for(let i=0;i<weeks;i++){
    const dateStr = addDaysStr(firstDate, 7*i);
    const monthKey = dateStr.slice(0,7);
    const alreadyThisClient = db.appointments.some(a=>a.monthlyClientId===c.id && a.date===dateStr && a.status!=='cancelado');
    if(alreadyThisClient){ continue; }
    const free = getSlots(barber.id, dateStr, service.duration, 30).includes(c.start);
    if(!free){
      const motivo = getEffectiveHours(barber.id, dateStr) ? 'horário ocupado' : 'dia fechado';
      skipped.push(prettyDate(dateStr)+' ('+motivo+')');
      continue;
    }
    const isFirstOfMonth = !monthsSeen[monthKey];
    monthsSeen[monthKey] = true;
    db.appointments.push({
      id:uid(), groupId, monthlyClientId:c.id, barberId:barber.id, serviceId:service.id,
      serviceName:(isFirstOfMonth ? 'Mensal - ' : 'Mensal (incluso) - ')+service.name,
      servicePrice: isFirstOfMonth ? (c.monthlyValue||0) : 0,
      clientName:c.name, clientPhone:c.phone, date:dateStr, start:c.start, end:c.start+service.duration,
      status:'confirmado', source:'barbeiro', recurring:true, createdAt:Date.now()
    });
    created++;
  }
  await saveDB();
  render();
  alert(`Agendamentos gerados: ${created}.`+(skipped.length ? (' Semanas puladas: '+skipped.join(', ')) : ''));
  if(created>0 && c.phone && confirm('Deseja avisar o cliente pelo WhatsApp sobre o agendamento mensal?')){
    const dayLabels = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
    /* Mensagem do mensal nunca leva valor — é combinado à parte, fora do app. */
    const msg = `Olá ${c.name}! Aqui é a ${barber.name}. Confirmando seu atendimento mensal: toda ${dayLabels[c.dow]} às ${minToLabel(c.start)}. Qualquer alteração me avisa por aqui!`;
    openWhats(c.phone, msg);
  }
}

function renderBarberNewAppt(){
  const barber = db.barbers.find(b=>b.id===state.barberSession);
  /* IMPORTANTE: precisa ser o mesmo objeto salvo em state.newAppt (não uma cópia solta),
     senão o que for digitado antes de escolher data/serviço se perde na primeira troca. */

  const serviceOpts = db.services.map(s=>`<option value="${s.id}" ${draft.serviceId===s.id?'selected':''}>${esc(s.name)} — ${s.duration}min — R$${s.price}</option>`).join('');
  let slotHtml = '';
  let encaixeHtml = '';
  if(draft.serviceId){

      ? '<div class="slotgrid">'+slots.map(m=>`<div class="slotbtn ${draft.slot===m && !draft.forceOverlap?'active':''}" onclick="pickManualSlot(${m})">${minToLabel(m)}</div>`).join('')+'</div>'
      : '<div class="empty">Sem horários livres nesse dia.</div>';
    /* Encaixe: permite registrar um atendimento em qualquer horário, mesmo que já haja
       outro agendamento nele — útil quando um corte termina mais rápido e dá pra encaixar
       outro serviço dentro dos mesmos 30 minutos. */
    const showForm = !!draft.showCustomTime;
    encaixeHtml = `
      <div style="margin-top:10px">
        <button type="button" class="btn btn-sm btn-outline" onclick="state.newAppt.showCustomTime=${!showForm};render()">${showForm?'Cancelar encaixe':'+ Encaixar em outro horário (mesmo ocupado)'}</button>
        ${showForm ? `
          <div class="sub" style="margin:8px 0 4px">Use quando o atendimento anterior acabou mais rápido e dá pra encaixar esse aqui no meio do horário — mesmo que já tenha outro agendamento nesse intervalo.</div>
          <input id="manCustomTime" placeholder="ex: 14:15" inputmode="numeric" oninput="maskTimeInput(this)" value="${draft.customTimeText||''}">
          <button class="btn btn-sm btn-steel" style="margin-top:6px" onclick="pickManualCustomSlot()">Usar esse horário</button>

        ${(draft.forceOverlap && draft.slot!=null) ? `<div class="sub" style="margin-top:8px;color:var(--gold)">Encaixe selecionado: ${minToLabel(draft.slot)}–${minToLabel(draft.slot+service.duration)} (pode se sobrepor a outro agendamento)</div>` : ''}
      </div>`;
  }
  let strip='';
  for(let i=0;i<14;i++){
    const d = addDaysStr(todayStr(), i);
    const dd = new Date(d+'T00:00:00');
    strip += `<div class="datebtn ${draft.date===d?'active':''}" onclick="pickManualDate('${d}')">${dd.toLocaleDateString('pt-BR',{weekday:'short'})}<b>${pad(dd.getDate())}</b></div>`;
  }
  return `
    <div class="topbar"><button class="link-btn" onclick="go('barberDashboard')">‹ Voltar</button></div>
    <div class="content">
      <h1 class="page">Novo agendamento</h1>
      <label class="field-label">Cliente</label>
      <input id="manName" placeholder="Nome do cliente" value="${esc(draft.clientName||'')}" oninput="state.newAppt.clientName=this.value">
      <label class="field-label">WhatsApp do cliente</label>
      <input id="manPhone" placeholder="11999998888" value="${esc(draft.clientPhone||'')}" oninput="state.newAppt.clientPhone=this.value">
      <label class="field-label">Serviço</label>
      <select onchange="pickManualService(this.value)"><option value="">Selecione</option>${serviceOpts}</select>
      <label class="field-label">Data</label>
      <div class="datestrip">${strip}</div>
      ${slotHtml}
      ${encaixeHtml}
      ${(draft.serviceId && draft.slot!=null) ? `
      <div class="card" style="margin-top:14px">
        <label class="field-label" style="margin:0 0 8px">Repetição</label>
        <select onchange="state.newAppt.repeatType=this.value;render()">
          <option value="none" ${(!draft.repeatType||draft.repeatType==='none')?'selected':''}>Não repetir</option>
          <option value="weekly" ${draft.repeatType==='weekly'?'selected':''}>Repetir semanalmente (ex: cliente mensal)</option>
          <option value="monthly" ${draft.repeatType==='monthly'?'selected':''}>Repetir mensalmente (mesmo dia do mês)</option>
        </select>
        ${draft.repeatType==='weekly' ? `
        <label class="field-label" style="margin-top:10px">Repetir por quantas semanas</label>
        <input type="number" min="1" max="52" value="${draft.repeatWeeks||8}" onchange="state.newAppt.repeatWeeks=parseInt(this.value)||1">
        <div class="sub">Vamos criar o mesmo horário toda semana. Se alguma semana já estiver ocupada, avisamos e pulamos ela.</div>
        ` : ''}
        ${draft.repeatType==='monthly' ? `
        <label class="field-label" style="margin-top:10px">Repetir por quantos meses</label>

        <div class="sub">Vamos tentar criar o mesmo horário nos próximos meses. Se algum mês já estiver ocupado nesse horário, avisamos e pulamos ele.</div>
        ` : ''}
      </div>
      <button class="btn btn-gold" style="margin-top:16px" onclick="submitManualBooking()">Salvar agendamento</button>` : ''}

function pickManualDate(d){ state.newAppt = Object.assign({date:todayStr()}, state.newAppt, {date:d}); render(); }
function pickManualService(sid){ state.newAppt = Object.assign({date:todayStr()}, state.newAppt, {serviceId:sid, slot:null, forceOverlap:false, showCustomTime:false}); render(); }
function pickManualSlot(m){ state.newAppt.slot = m; state.newAppt.forceOverlap = false; render(); }
function pickManualCustomSlot(){
  const v = document.getElementById('manCustomTime').value;
  const m = parseHHMM(v);
  if(m==null){ alert('Digite um horário válido, ex: 14:15'); return; }
  state.newAppt.slot = m;
  state.newAppt.forceOverlap = true;
  state.newAppt.showCustomTime = false;
  state.newAppt.customTimeText = v;
  render();
}
function addMonthsStr(base, n){
  const d = new Date(base+'T00:00:00');
  const targetDay = d.getDate();
  d.setMonth(d.getMonth()+n);
  // se o mês de destino não tem esse dia (ex: 31), o JS já ajusta para o próximo mês — corrige voltando pro último dia do mês certo
  if(d.getDate() !== targetDay && d.getDate() < targetDay){
    d.setDate(0);
  }
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}

async function submitManualBooking(){
  const barber = db.barbers.find(b=>b.id===state.barberSession);
  const d = state.newAppt;
  const name = (document.getElementById('manName').value||'').trim();
  const phone = (document.getElementById('manPhone').value||'').trim();
  if(!name){ alert('Informe o nome do cliente.'); return; }
  const service = db.services.find(s=>s.id===d.serviceId);
  if(d.forceOverlap){
    /* Encaixe proposital: não bloqueia por conflito de horário, só garante que está dentro do expediente do dia. */
    const hours = getEffectiveHours(barber.id, d.date);
    if(!hours || d.slot < hours.start || d.slot + service.duration > hours.end){
      alert('Esse horário está fora do expediente nesse dia.'); return;
    }
  } else {
    const stillFree = getSlots(barber.id, d.date, service.duration, 30).includes(d.slot);
    if(!stillFree){ alert('Esse horário acabou de ser ocupado.'); render(); return; }
  }
  const repeatType = d.repeatType || 'none';
  const groupId = repeatType!=='none' ? uid() : null;
  const appt = {
    id: uid(), groupId, barberId:barber.id, serviceId:service.id, serviceName:service.name, servicePrice:service.price,
    clientName:name, clientPhone:phone, date:d.date, start:d.slot, end:d.slot+service.duration,
    status:'confirmado', source:'barbeiro', overlap:!!d.forceOverlap, createdAt:Date.now()
  };
  db.appointments.push(appt);
  let skipped = [];
  if(repeatType==='weekly'){
    const weeks = Math.min(52, Math.max(1, d.repeatWeeks||8));
    for(let i=1;i<=weeks;i++){
      const futureDate = addDaysStr(d.date, 7*i);
      const free = getSlots(barber.id, futureDate, service.duration, 30).includes(d.slot);
      if(free){
        db.appointments.push({
          id: uid(), groupId, barberId:barber.id, serviceId:service.id, serviceName:service.name, servicePrice:service.price,
          clientName:name, clientPhone:phone, date:futureDate, start:d.slot, end:d.slot+service.duration,
          status:'confirmado', source:'barbeiro', recurring:true, createdAt:Date.now()
        });
      } else {
        skipped.push(prettyDate(futureDate));
      }
    }
  } else if(repeatType==='monthly'){
    const months = Math.min(12, Math.max(1, d.repeatMonths||3));
    for(let i=1;i<=months;i++){
      const futureDate = addMonthsStr(d.date, i);
      const free = getSlots(barber.id, futureDate, service.duration, 30).includes(d.slot);
      if(free){
        db.appointments.push({
          id: uid(), groupId, barberId:barber.id, serviceId:service.id, serviceName:service.name, servicePrice:service.price,
          clientName:name, clientPhone:phone, date:futureDate, start:d.slot, end:d.slot+service.duration,
          status:'confirmado', source:'barbeiro', recurring:true, createdAt:Date.now()
        });
      } else {
        skipped.push(prettyDate(futureDate));
      }
    }
  }
  await saveDB();
  if(phone){
    const valorTxt = service.price>0 ? ` Valor R$ ${service.price.toFixed(2)}.` : '';
    openWhats(phone, `Olá ${name}! Aqui é a ${barber.name}. Confirmando seu horário de ${service.name} em ${prettyDate(d.date)} às ${minToLabel(d.slot)}.${valorTxt}`);
  }
  state.newAppt = null;
  go('barberDashboard');
  if(skipped.length){
    setTimeout(()=>alert('Alguns meses da repetição já estavam ocupados nesse horário e foram pulados: '+skipped.join(', ')), 200);
  }
}
